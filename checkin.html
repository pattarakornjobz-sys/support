<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เช็คอินรับอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
    --good:#22C55E; --good-bg:#E7F9EE;
    --warn:#FFC857; --warn-bg:#FFF6E0;
    --bad:#FF6B6B; --bad-bg:#FFE8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px; font-size:16px; line-height:1.6; min-height:100vh;
  }
  .wrap{max-width:480px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(19px, 6vw, 23px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 8px;}
  .meal-period{text-align:center; font-size:13.5px; color:var(--gold-light); margin-bottom:20px;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:16px; text-align:center;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px; margin-bottom:14px;}
  .id-input{
    width:100%; padding:16px; border-radius:12px; border:1.5px solid rgba(31,45,61,0.16);
    background:var(--ivory-dim); font-family:'Kanit',sans-serif; font-size:22px; letter-spacing:2px;
    text-align:center; color:var(--ink); font-weight:700;
  }
  .id-input:focus{outline:none; border-color:var(--gold);}
  .id-hint{font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .confirm-btn{
    width:100%; margin-top:16px; padding:16px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#D9A628,#B8860B); color:#fff; font-weight:700; font-size:16px;
    cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(217,166,40,0.4);
  }
  .confirm-btn:disabled{background:#B9C6D4; box-shadow:none; cursor:default;}
  .confirm-btn.warn{background:linear-gradient(180deg,#FFC857,#E0A526); box-shadow:0 8px 20px rgba(255,200,87,0.4);}
  .person{margin-bottom:8px;}
  .person .avatar{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:'Prompt',sans-serif;font-weight:800;font-size:24px;}
  .person .name{font-family:'Prompt',sans-serif;font-weight:700;font-size:18px;}
  .person .unit{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .warn-box{background:var(--warn-bg); color:#8A6200; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; margin:14px 0; text-align:left;}
  .link-btn{margin-top:14px; background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit;}
  .success .seal{width:88px; height:88px; border-radius:50%; background:linear-gradient(180deg,#34D399,#22C55E); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 10px 26px rgba(34,197,94,0.35);}
  .success .seal svg{width:44px; height:44px; color:#fff;}
  .success h2{font-family:'Prompt',sans-serif; font-weight:700; font-size:22px; margin:0 0 8px;}
  .success p{font-size:15px; margin:0 0 4px; color:var(--ink-soft);}
  .success .time{font-family:'Kanit',sans-serif; font-weight:700; font-size:15px;}
  .btn-outline{margin-top:18px; padding:12px 22px; border-radius:12px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
  .error{color:#D64550; background:#FFE8E8; border:1px solid #FFC9C9; padding:12px; border-radius:10px; font-size:13.5px; font-weight:600; margin-top:10px;}
  .loading{color:var(--ink-soft); padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>เช็คอินรับอาหาร</h1>
  <div class="rule"></div>
  <div class="meal-period" id="periodLabel"></div>
  <div id="content"></div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const STORAGE_KEY = 'mess_checkin_phone';

function mealPeriod(){
  const h = new Date().getHours();
  if(h < 10) return 'เช้า';
  if(h < 14) return 'กลางวัน';
  return 'เย็น';
}
const period = mealPeriod();
document.getElementById('periodLabel').textContent = 'มื้อ' + period + ' · ' + new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long' });

let currentStaff = null;
let maxClaims = 1;
let cooldownHours = 3;

async function loadMaxClaims(){
  try{
    const { data } = await sb.from('checkin_settings').select('key,value').in('key', ['max_claims_per_meal','cooldown_hours']);
    if(data){
      data.forEach(row => {
        if(row.key === 'max_claims_per_meal' && row.value) maxClaims = row.value;
        if(row.key === 'cooldown_hours' && row.value !== null && row.value !== undefined) cooldownHours = row.value;
      });
    }
  }catch(e){ /* fall back to defaults */ }
}

function formatRemaining(ms){
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h > 0) return h + ' ชม. ' + m + ' นาที';
  return m + ' นาที';
}

function renderInput(prefill, autoLookup){
  if(autoLookup === undefined) autoLookup = true;
  const el = document.getElementById('content');
  el.innerHTML =
    '<div class="card">' +
      '<div class="sec-title">กรอกเบอร์โทรศัพท์ 10 หลัก</div>' +
      '<input type="tel" inputmode="numeric" maxlength="10" class="id-input" id="idInput" placeholder="08X XXX XXXX" value="' + (prefill||'') + '">' +
      '<div class="id-hint">ใช้เพื่อยืนยันตัวตนของเจ้าหน้าที่เท่านั้น</div>' +
      '<button class="confirm-btn" id="lookupBtn" disabled onclick="lookup()">ค้นหา</button>' +
      '<div id="errArea"></div>' +
    '</div>';
  const input = document.getElementById('idInput');
  const btn = document.getElementById('lookupBtn');
  input.oninput = () => {
    input.value = input.value.replace(/[^0-9]/g,'').slice(0,10);
    btn.disabled = input.value.length !== 10;
  };
  input.dispatchEvent(new Event('input'));
  input.focus();
  if(autoLookup && prefill && prefill.length === 10){ lookup(); }
}

async function lookup(){
  const idNum = document.getElementById('idInput').value;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card"><div class="loading">กำลังค้นหาข้อมูล…</div></div>';
  try{
    const { data, error } = await sb.from('staff_roster').select('*').eq('phone_number', idNum).maybeSingle();
    if(error) throw error;
    if(!data){
      renderInput(idNum, false);
      document.getElementById('errArea').innerHTML = '<div class="error">ไม่พบเบอร์นี้ในระบบ กรุณาติดต่อเจ้าหน้าที่เพื่อเพิ่มข้อมูล</div>';
      return;
    }
    currentStaff = data;
    await checkAndConfirm();
  }catch(e){
    console.error(e);
    renderInput(idNum, false);
    document.getElementById('errArea').innerHTML = '<div class="error">ค้นหาไม่สำเร็จ: ' + (e?.message||e) + '</div>';
  }
}

let confirming = false;

async function checkAndConfirm(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card"><div class="loading">กำลังตรวจสอบ…</div></div>';
  const today = new Date().toLocaleDateString('en-CA');
  let existingCount = 0;
  let cooldownRemainingMs = 0;
  try{
    const { data, error } = await sb.from('meal_checkins').select('id')
      .eq('staff_id', currentStaff.id).eq('checkin_date', today).eq('meal_period', period);
    if(error) throw error;
    existingCount = data.length;

    const { data: lastRow, error: lastErr } = await sb.from('meal_checkins').select('created_at')
      .eq('staff_id', currentStaff.id).order('created_at', { ascending:false }).limit(1).maybeSingle();
    if(lastErr) throw lastErr;
    if(lastRow){
      const elapsedMs = Date.now() - new Date(lastRow.created_at).getTime();
      const cooldownMs = cooldownHours * 60 * 60 * 1000;
      if(elapsedMs < cooldownMs) cooldownRemainingMs = cooldownMs - elapsedMs;
    }
  }catch(e){ console.error(e); }

  const initials = (currentStaff.first_name||'?').charAt(0);
  const onCooldown = cooldownRemainingMs > 0;
  const quotaBlocked = existingCount >= maxClaims;
  const blocked = onCooldown || quotaBlocked;

  let blockMsg = '';
  if(onCooldown){
    blockMsg = '🔒 ท่านเพิ่งเช็คอินรับอาหารไปเมื่อสักครู่ กรุณารออีก ' + formatRemaining(cooldownRemainingMs) + ' จึงจะเช็คอินได้อีกครั้ง (ล็อค ' + cooldownHours + ' ชม./ครั้ง)';
  }else if(quotaBlocked){
    blockMsg = '🔒 ท่านรับอาหารมื้อ' + period + 'ครบโควตาแล้ว (' + existingCount + '/' + maxClaims + ' ครั้ง) ไม่สามารถเช็คอินซ้ำได้ หากมีเหตุจำเป็นกรุณาติดต่อเจ้าหน้าที่ผู้ควบคุมโดยตรง';
  }

  el.innerHTML =
    '<div class="card">' +
      '<div class="person">' +
        '<div class="avatar">' + initials + '</div>' +
        '<div class="name">' + (currentStaff.title||'') + currentStaff.first_name + ' ' + currentStaff.last_name + '</div>' +
        '<div class="unit">' + (currentStaff.unit || '') + '</div>' +
      '</div>' +
      (blocked
        ? ('<div class="warn-box" style="background:var(--bad-bg); color:#B4322F;">' + blockMsg + '</div>' +
           '<button class="btn-outline" onclick="renderInput(\'\')" style="width:100%;">เปลี่ยนคน</button>')
        : ('<button class="confirm-btn" id="confirmBtn" onclick="confirmCheckin(' + existingCount + ')">ยืนยันรับอาหาร มื้อ' + period + '</button>' +
           '<button class="link-btn" onclick="renderInput(\'\')">ไม่ใช่ฉัน / เปลี่ยนคน</button>')
      ) +
    '</div>';
}

async function confirmCheckin(existingCount){
  if(confirming) return;
  confirming = true;
  const btn = document.getElementById('confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; }
  const el = document.getElementById('content');
  try{
    // re-check right before insert to close the race window between two devices/taps
    const today = new Date().toLocaleDateString('en-CA');
    const { data: lastRow, error: lastErr } = await sb.from('meal_checkins').select('created_at')
      .eq('staff_id', currentStaff.id).order('created_at', { ascending:false }).limit(1).maybeSingle();
    if(lastErr) throw lastErr;
    if(lastRow){
      const elapsedMs = Date.now() - new Date(lastRow.created_at).getTime();
      if(elapsedMs < cooldownHours * 60 * 60 * 1000){
        await checkAndConfirm();
        return;
      }
    }
    const { data: recheck, error: recheckErr } = await sb.from('meal_checkins').select('id')
      .eq('staff_id', currentStaff.id).eq('checkin_date', today).eq('meal_period', period);
    if(recheckErr) throw recheckErr;
    if(recheck.length >= maxClaims){
      await checkAndConfirm();
      return;
    }
    const { error } = await sb.from('meal_checkins').insert({
      checkin_date: today,
      meal_period: period,
      unit: currentStaff.unit || '',
      staff_id: currentStaff.id,
      phone_number: currentStaff.phone_number,
      full_name: (currentStaff.title||'') + currentStaff.first_name + ' ' + currentStaff.last_name,
      sequence_number: recheck.length + 1,
    });
    if(error) throw error;
    localStorage.setItem(STORAGE_KEY, currentStaff.phone_number);
    const now = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
    el.innerHTML =
      '<div class="card"><div class="success">' +
        '<div class="seal">' + CHECK_ICON + '</div>' +
        '<h2>เช็คอินสำเร็จ</h2>' +
        '<p>' + (currentStaff.title||'') + currentStaff.first_name + ' ' + currentStaff.last_name + '</p>' +
        '<div class="time">รับอาหารมื้อ' + period + ' เวลา ' + now + ' น. (ครั้งที่ ' + (recheck.length+1) + ')</div>' +
        '<button class="btn-outline" onclick="renderInput(\'\')">เช็คอินคนถัดไป</button>' +
      '</div></div>';
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="card"><div class="error">บันทึกไม่สำเร็จ: ' + (e?.message||e) + '</div>' +
      '<button class="btn-outline" onclick="checkAndConfirm()" style="display:block;margin:14px auto 0;">ลองใหม่</button></div>';
  }finally{
    confirming = false;
  }
}

(async function init(){
  await loadMaxClaims();
  const saved = localStorage.getItem(STORAGE_KEY);
  renderInput(saved || '');
})();
</script>
</body>
</html>
