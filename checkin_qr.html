<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Code เช็คอินรับอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px;
    font-size:16px; line-height:1.6;
  }
  .wrap{max-width:520px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(19px, 6vw, 23px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 20px;}
  .navlinks{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
  .navlink{padding:8px 14px; border-radius:20px; background:rgba(255,255,255,0.15); color:var(--gold-light); font-size:12.5px; font-weight:600; text-decoration:none;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:26px 22px; margin-bottom:16px; text-align:center;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .qr-title{font-family:'Prompt',sans-serif; font-weight:800; font-size:20px; margin-bottom:4px;}
  .qr-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:20px;}
  .qr-img{width:260px; height:260px; border-radius:14px; border:1px solid rgba(31,45,61,0.1); margin:0 auto 16px; display:block;}
  .qr-url{font-size:11.5px; color:var(--ink-soft); word-break:break-all; padding:10px; background:var(--ivory-dim); border-radius:8px;}
  .print-btn{margin-top:16px; padding:12px 22px; border-radius:12px; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;}
  .counter-row{display:flex; gap:10px;}
  .counter-item{flex:1; background:var(--ivory-dim); border-radius:14px; padding:16px 10px; text-align:center;}
  .counter-item .num{font-family:'Prompt',sans-serif; font-weight:800; font-size:26px; color:var(--ink);}
  .counter-item .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .refresh-btn{margin-top:14px; padding:9px 16px; border-radius:8px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;}
  .date-range{display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:16px; font-size:13px; flex-wrap:wrap;}
  .date-range input{padding:9px 12px; border-radius:8px; border:1.5px solid rgba(31,45,61,0.16); background:var(--ivory-dim); font-family:inherit; font-size:14px; color:var(--ink);}
  .export-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:10px; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
  .export-btn:disabled{background:#B9C6D4; cursor:default;}
  .export-btn svg{width:17px;height:17px;}
  .export-msg{margin-top:12px; font-size:13px; text-align:center;}
  .export-msg.ok{color:#1A7A45;}
  .export-msg.err{color:#B4322F;}
  @media print{
    body{background:#fff !important; background-image:none !important; padding:0;}
    .navlinks, .counter-card, .export-card, .print-btn{display:none !important;}
    .card{box-shadow:none; border:2px solid #000;}
    h1{-webkit-text-fill-color:#000; background:none; color:#000 !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR เช็คอินรับอาหาร</h1>
  <div class="rule"></div>
  <div class="navlinks">
    <a class="navlink" href="checkin_dashboard.html">📈 สรุปสถิติเช็คอิน</a>
    <a class="navlink" href="guest_checkin_qr.html">🎫 QR แขกภายนอก</a>
    <a class="navlink" href="staff_import.html">👥 นำเข้าเจ้าหน้าที่</a>
    <a class="navlink" href="mess_input.html">✏️ บันทึกข้อมูล</a>
    <a class="navlink" href="mess_kpi.html">📊 ดู KPI</a>
    <a class="navlink" href="mess_report.html">📄 รายงาน 1 หน้า</a>
  </div>

  <div class="card">
    <div class="qr-title">สแกนเพื่อเช็คอินรับอาหาร</div>
    <div class="qr-sub">ร้าน Rus Hotel ครัวกลาง</div>
    <img class="qr-img" id="qrImg" alt="QR Code">
    <div class="qr-url" id="urlText"></div>
    <button class="print-btn" onclick="window.print()">🖨️ พิมพ์ป้าย QR</button>
  </div>

  <div class="card counter-card">
    <div class="qr-title" style="margin-bottom:14px;">ยอดเช็คอินวันนี้</div>
    <div class="counter-row" id="counterRow">
      <div class="counter-item"><div class="num">…</div><div class="lbl">ทั้งหมด</div></div>
    </div>
    <button class="refresh-btn" onclick="loadCount()">↻ รีเฟรช</button>
  </div>

  <div class="card export-card">
    <div class="qr-title" style="margin-bottom:14px;">รายชื่อผู้เช็คอิน</div>
    <div class="date-range">
      <span>จาก</span>
      <input type="date" id="dateFrom">
      <span>ถึง</span>
      <input type="date" id="dateTo">
    </div>
    <button class="export-btn" id="exportBtn" onclick="exportExcel()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M9 9v11"/></svg>
      Export Excel
    </button>
    <div id="exportMsg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

// Auto-detect the deployed checkin.html URL from wherever this page itself is hosted
const targetUrl = new URL('checkin.html', window.location.href).href;
document.getElementById('urlText').textContent = targetUrl;
document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(targetUrl);

async function loadCount(){
  const row = document.getElementById('counterRow');
  row.innerHTML = `<div class="counter-item"><div class="num">…</div><div class="lbl">กำลังโหลด</div></div>`;
  try{
    const today = new Date().toISOString().slice(0,10);
    const { data, error } = await sb.from('meal_checkins').select('meal_period').eq('checkin_date', today);
    if(error) throw error;
    const total = data.length;
    const counts = { 'เช้า':0, 'กลางวัน':0, 'เย็น':0 };
    data.forEach(r => { if(counts[r.meal_period] !== undefined) counts[r.meal_period]++; });
    row.innerHTML = `
      <div class="counter-item"><div class="num">${total}</div><div class="lbl">ทั้งหมด</div></div>
      <div class="counter-item"><div class="num">${counts['เช้า']}</div><div class="lbl">เช้า</div></div>
      <div class="counter-item"><div class="num">${counts['กลางวัน']}</div><div class="lbl">กลางวัน</div></div>
      <div class="counter-item"><div class="num">${counts['เย็น']}</div><div class="lbl">เย็น</div></div>
    `;
  }catch(e){
    console.error(e);
    row.innerHTML = `<div class="counter-item"><div class="num">-</div><div class="lbl">โหลดไม่สำเร็จ</div></div>`;
  }
}
loadCount();

const todayStr = new Date().toISOString().slice(0,10);
document.getElementById('dateFrom').value = todayStr;
document.getElementById('dateTo').value = todayStr;

async function exportExcel(){
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  const msgEl = document.getElementById('exportMsg');
  const btn = document.getElementById('exportBtn');
  if(!from || !to){ msgEl.innerHTML = '<div class="export-msg err">กรุณาเลือกช่วงวันที่</div>'; return; }
  btn.disabled = true;
  const originalHtml = btn.innerHTML;
  btn.innerHTML = 'กำลังโหลดข้อมูล…';
  msgEl.innerHTML = '';
  try{
    const { data, error } = await sb.from('meal_checkins').select('*')
      .gte('checkin_date', from).lte('checkin_date', to)
      .order('checkin_date', { ascending: true }).order('created_at', { ascending: true });
    if(error) throw error;
    if(!data.length){
      msgEl.innerHTML = '<div class="export-msg err">ไม่มีข้อมูลเช็คอินในช่วงวันที่เลือก</div>';
      return;
    }
    const rows = data.map(r => ({
      'วันที่': new Date(r.checkin_date + 'T00:00:00').toLocaleDateString('th-TH'),
      'มื้อ': r.meal_period,
      'ชื่อ-นามสกุล': r.full_name || '',
      'เบอร์โทรศัพท์': r.phone_number || '',
      'หน่วยงาน': r.unit + (r.other_unit_name ? (': ' + r.other_unit_name) : ''),
      'ครั้งที่': r.sequence_number || 1,
      'เวลาเช็คอิน': new Date(r.created_at).toLocaleString('th-TH'),
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.min(Math.max(k.length + 4, 14), 30) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'เช็คอิน');
    XLSX.writeFile(wb, `รายชื่อเช็คอินรับอาหาร_${from}_ถึง_${to}.xlsx`);
    msgEl.innerHTML = `<div class="export-msg ok">✓ ดาวน์โหลดแล้ว ${data.length} รายการ</div>`;
  }catch(e){
    console.error(e);
    msgEl.innerHTML = '<div class="export-msg err">ดึงข้อมูลไม่สำเร็จ: ' + (e?.message || e) + '</div>';
  }finally{
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}
</script>
</body>
</html>
