<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>แจ้งรับรองแขกภายนอก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px; font-size:16px; line-height:1.6;
  }
  .wrap{max-width:560px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(19px, 6vw, 23px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 8px;}
  .vendor-note{text-align:center; font-size:13px; color:var(--gold-light); margin:0 0 20px; line-height:1.6; max-width:440px; margin-left:auto; margin-right:auto; padding:10px 14px; border:1px solid rgba(217,166,40,0.3); border-radius:8px; background:rgba(217,166,40,0.06);}
  .navlinks{display:flex; gap:8px; justify-content:center; margin-bottom:20px; flex-wrap:wrap;}
  .navlink{padding:8px 14px; border-radius:20px; background:rgba(255,255,255,0.15); color:var(--gold-light); font-size:12.5px; font-weight:600; text-decoration:none;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:16px;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px; margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .field-row.single{grid-template-columns:1fr;}
  .field{display:flex; flex-direction:column;}
  .field label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field{min-width:0;}
  .field input, .field textarea{
    width:100%; box-sizing:border-box; padding:11px 12px; border-radius:8px; border:1.5px solid rgba(31,45,61,0.16);
    background:rgba(255,255,255,0.6); font-family:inherit; font-size:15px; color:var(--ink);
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,166,40,0.15);}
  .submit-btn{
    width:100%; padding:16px; border-radius:10px; border:none;
    background:linear-gradient(180deg,#D9A628,#B8860B); color:#fff; font-weight:700; font-size:16px;
    cursor:pointer; font-family:inherit; box-shadow:0 10px 24px rgba(217,166,40,0.35);
  }
  .submit-btn:disabled{background:#B9C6D4; box-shadow:none; cursor:default;}
  .error{color:#D64550; background:#FFE8E8; border:1px solid #FFC9C9; padding:10px 12px; border-radius:8px; font-size:14px; font-weight:600; margin-bottom:14px;}
  .success{text-align:center; padding:6px 0;}
  .success .lbl{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
  .code-box{
    font-family:'Kanit',sans-serif; font-weight:800; font-size:44px; letter-spacing:10px;
    color:var(--ink); background:var(--ivory-dim); border-radius:14px; padding:20px 10px;
    margin-bottom:18px; border:2px dashed var(--gold);
  }
  .success .detail{font-size:14.5px; color:var(--ink-soft); margin-bottom:6px; text-align:left; background:var(--ivory-dim); border-radius:10px; padding:14px;}
  .success .detail b{color:var(--ink);}
  .btn-outline{margin-top:14px; padding:12px 22px; border-radius:10px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <h1>แจ้งรับรองแขกภายนอก</h1>
  <div class="rule"></div>
  <div class="vendor-note">ร้าน Rus Hotel ครัวกลาง — แจ้งล่วงหน้าอย่างน้อย 1 วันก่อนแขกมาเยือน</div>
  <div class="navlinks">
    <a class="navlink" href="guest_checkin_qr.html">🔳 QR สำหรับแขก</a>
  </div>
  <div id="content"></div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

let state = {
  request_unit:'', contact_person:'', contact_phone:'',
  visit_date:'', guest_count_approved:'', notes:'',
  submitting:false, submitted:false, error:'', generatedCode:'',
};

function tomorrowStr(){
  const d = new Date(); d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
state.visit_date = tomorrowStr();

const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function isoToDMY(iso){
  const d = new Date(iso + 'T00:00:00');
  return { day: d.getDate(), month: d.getMonth()+1, yearBE: d.getFullYear() + 543 };
}
function dmyToIso(day, month, yearBE){
  const yearCE = yearBE - 543;
  const mm = String(month).padStart(2,'0');
  const dd = String(day).padStart(2,'0');
  return yearCE + '-' + mm + '-' + dd;
}

function dateSelectsHtml(){
  const dmy = isoToDMY(state.visit_date);
  const nowBE = new Date().getFullYear() + 543;
  let dayOpts = '';
  for(let i=1;i<=31;i++) dayOpts += '<option value="'+i+'"'+(i===dmy.day?' selected':'')+'>'+i+'</option>';
  let monthOpts = '';
  THAI_MONTHS.forEach(function(name, idx){
    const m = idx+1;
    monthOpts += '<option value="'+m+'"'+(m===dmy.month?' selected':'')+'>'+name+'</option>';
  });
  let yearOpts = '';
  for(let y=nowBE; y<=nowBE+2; y++) yearOpts += '<option value="'+y+'"'+(y===dmy.yearBE?' selected':'')+'>'+y+'</option>';
  return '<div style="display:flex; gap:8px;">' +
    '<select id="visitDay" style="flex:1; min-width:0; padding:11px 8px; border-radius:8px; border:1.5px solid rgba(31,45,61,0.16); background:rgba(255,255,255,0.6); font-family:inherit; font-size:14px; color:var(--ink);">'+dayOpts+'</select>' +
    '<select id="visitMonth" style="flex:1.6; min-width:0; padding:11px 8px; border-radius:8px; border:1.5px solid rgba(31,45,61,0.16); background:rgba(255,255,255,0.6); font-family:inherit; font-size:14px; color:var(--ink);">'+monthOpts+'</select>' +
    '<select id="visitYear" style="flex:1; min-width:0; padding:11px 8px; border-radius:8px; border:1.5px solid rgba(31,45,61,0.16); background:rgba(255,255,255,0.6); font-family:inherit; font-size:14px; color:var(--ink);">'+yearOpts+'</select>' +
  '</div>';
}
function attachDateSelectHandlers(){
  function update(){
    const d = document.getElementById('visitDay').value;
    const m = document.getElementById('visitMonth').value;
    const y = document.getElementById('visitYear').value;
    state.visit_date = dmyToIso(d, m, y);
  }
  ['visitDay','visitMonth','visitYear'].forEach(function(id){
    const elx = document.getElementById(id);
    if(elx) elx.onchange = update;
  });
}

function renderForm(){
  const el = document.getElementById('content');
  if(state.submitted){
    el.innerHTML =
      '<div class="card"><div class="success">' +
        '<div class="lbl">รหัสสำหรับแขก (ใช้ได้เฉพาะวันที่ระบุเท่านั้น)</div>' +
        '<div class="code-box">' + state.generatedCode + '</div>' +
        '<div class="detail">' +
          '<div><b>หน่วยงาน:</b> ' + state.request_unit + '</div>' +
          '<div><b>วันที่มาเยือน:</b> ' + new Date(state.visit_date+'T00:00:00').toLocaleDateString('th-TH', {day:'numeric',month:'long',year:'numeric'}) + '</div>' +
          '<div><b>จำนวนที่อนุมัติ:</b> ' + state.guest_count_approved + ' คน</div>' +
          '<div><b>ผู้ประสานงาน:</b> ' + state.contact_person + ' (' + state.contact_phone + ')</div>' +
        '</div>' +
        '<div style="font-size:13px;color:var(--ink-soft);">ส่งรหัสนี้ให้แขกหรือผู้ประสานงานฝ่ายแขก เพื่อใช้กรอกตอนสแกน QR ที่จุดรับอาหาร รหัสนี้ใช้ได้เฉพาะวันที่ระบุ และใช้ได้ไม่เกินจำนวนคนที่อนุมัติเท่านั้น</div>' +
        '<button class="btn-outline" onclick="resetForm()">แจ้งรายการใหม่</button>' +
      '</div></div>';
    return;
  }

  el.innerHTML =
    '<div class="card">' +
      '<div class="sec-title">ข้อมูลหน่วยงานผู้ขอ</div>' +
      '<div class="field-row">' +
        '<div class="field"><label>หน่วยงาน</label><input type="text" id="request_unit" value="' + state.request_unit + '" placeholder="เช่น สำนักงานพระคลังข้างที่"></div>' +
        '<div class="field"><label>ผู้ประสานงาน</label><input type="text" id="contact_person" value="' + state.contact_person + '"></div>' +
      '</div>' +
      '<div class="field-row single">' +
        '<div class="field"><label>เบอร์ติดต่อผู้ประสานงาน</label><input type="tel" id="contact_phone" value="' + state.contact_phone + '"></div>' +
      '</div>' +
      '<div class="field-row single">' +
        '<div class="field"><label>วันที่แขกมาเยือน (พ.ศ.)</label>' + dateSelectsHtml() + '</div>' +
      '</div>' +
      '<div class="field-row single">' +
        '<div class="field"><label>จำนวนแขกโดยประมาณ (คน)</label><input type="number" min="1" id="guest_count_approved" value="' + state.guest_count_approved + '" placeholder="เช่น 30"></div>' +
      '</div>' +
      '<div class="field-row single">' +
        '<div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><textarea id="notes" rows="2">' + state.notes + '</textarea></div>' +
      '</div>' +
      (state.error ? '<div class="error">' + state.error + '</div>' : '') +
      '<button class="submit-btn" id="submitBtn" ' + (state.submitting?'disabled':'') + ' onclick="handleSubmit()">' + (state.submitting?'กำลังบันทึก…':'สร้างรหัสสำหรับแขก') + '</button>' +
    '</div>';

  ['request_unit','contact_person','contact_phone','guest_count_approved','notes'].forEach(function(key){
    const elInput = document.getElementById(key);
    if(elInput) elInput.oninput = function(e){ state[key] = e.target.value; };
  });
  attachDateSelectHandlers();
}

function resetForm(){
  state = { request_unit:'', contact_person:'', contact_phone:'', visit_date:tomorrowStr(), guest_count_approved:'', notes:'', submitting:false, submitted:false, error:'', generatedCode:'' };
  renderForm();
}

function randomCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

async function generateUniqueCode(){
  for(let i=0;i<8;i++){
    const code = randomCode();
    const { data } = await sb.from('guest_passes').select('id').eq('pass_code', code).maybeSingle();
    if(!data) return code;
  }
  throw new Error('ไม่สามารถสร้างรหัสได้ กรุณาลองใหม่');
}

async function handleSubmit(){
  if(!state.request_unit.trim() || !state.contact_person.trim() || !state.contact_phone.trim() || !state.visit_date || !state.guest_count_approved){
    state.error = 'กรุณากรอกข้อมูลให้ครบทุกช่อง (ยกเว้นหมายเหตุ)';
    renderForm();
    return;
  }
  if(Number(state.guest_count_approved) < 1){
    state.error = 'จำนวนแขกต้องมากกว่า 0 คน';
    renderForm();
    return;
  }
  state.error = ''; state.submitting = true; renderForm();
  try{
    const code = await generateUniqueCode();
    const { error } = await sb.from('guest_passes').insert({
      pass_code: code,
      request_unit: state.request_unit.trim(),
      contact_person: state.contact_person.trim(),
      contact_phone: state.contact_phone.trim(),
      visit_date: state.visit_date,
      guest_count_approved: Number(state.guest_count_approved),
      notes: state.notes.trim(),
    });
    if(error) throw error;
    state.generatedCode = code;
    state.submitted = true;
  }catch(e){
    console.error(e);
    state.error = 'บันทึกไม่สำเร็จ: ' + (e?.message || e);
  }finally{
    state.submitting = false;
    renderForm();
  }
}

renderForm();
</script>
</body>
</html>
