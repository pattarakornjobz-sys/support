<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เช็คอินรับอาหาร (แขกภายนอก)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
    --good:#22C55E; --good-bg:#E7F9EE;
    --warn:#FFC857; --warn-bg:#FFF6E0;
    --bad:#FF6B6B; --bad-bg:#FFE8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px; font-size:16px; line-height:1.6; min-height:100vh;
  }
  .wrap{max-width:480px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(18px, 6vw, 22px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 8px;}
  .meal-period{text-align:center; font-size:13.5px; color:var(--gold-light); margin-bottom:20px;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:16px; text-align:center;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px; margin-bottom:14px;}
  .code-input{
    width:100%; padding:16px; border-radius:12px; border:1.5px solid rgba(31,45,61,0.16);
    background:var(--ivory-dim); font-family:'Kanit',sans-serif; font-size:26px; letter-spacing:8px;
    text-align:center; color:var(--ink); font-weight:700;
  }
  .code-input:focus{outline:none; border-color:var(--gold);}
  .name-input{
    width:100%; margin-top:14px; padding:14px; border-radius:12px; border:1.5px solid rgba(31,45,61,0.16);
    background:var(--ivory-dim); font-family:inherit; font-size:15px; color:var(--ink); text-align:center;
  }
  .name-input:focus{outline:none; border-color:var(--gold);}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .confirm-btn{
    width:100%; margin-top:16px; padding:16px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#D9A628,#B8860B); color:#fff; font-weight:700; font-size:16px;
    cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(217,166,40,0.4);
  }
  .confirm-btn:disabled{background:#B9C6D4; box-shadow:none; cursor:default;}
  .info-box{background:var(--good-bg); color:#1A7A45; border-radius:12px; padding:12px 14px; font-size:13.5px; font-weight:600; margin:14px 0; text-align:left;}
  .link-btn{margin-top:14px; background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit;}
  .success .seal{width:88px; height:88px; border-radius:50%; background:linear-gradient(180deg,#34D399,#22C55E); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; box-shadow:0 10px 26px rgba(34,197,94,0.35);}
  .success .seal svg{width:44px; height:44px; color:#fff;}
  .success h2{font-family:'Prompt',sans-serif; font-weight:700; font-size:22px; margin:0 0 8px;}
  .success p{font-size:15px; margin:0 0 4px; color:var(--ink-soft);}
  .success .time{font-family:'Kanit',sans-serif; font-weight:700; font-size:15px;}
  .btn-outline{margin-top:18px; padding:12px 22px; border-radius:12px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;}
  .error{color:#D64550; background:#FFE8E8; border:1px solid #FFC9C9; padding:12px; border-radius:10px; font-size:13.5px; font-weight:600; margin-top:10px;}
  .loading{color:var(--ink-soft); padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>เช็คอินรับอาหาร<br/>(แขกภายนอก)</h1>
  <div class="rule"></div>
  <div class="meal-period" id="periodLabel"></div>
  <div id="content"></div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function mealPeriod(){
  const h = new Date().getHours();
  if(h < 10) return 'เช้า';
  if(h < 14) return 'กลางวัน';
  return 'เย็น';
}
const period = mealPeriod();
document.getElementById('periodLabel').textContent = 'มื้อ' + period + ' \u00b7 ' + new Date().toLocaleDateString('th-TH', { day:'numeric', month:'long' });

let currentPass = null;
let usedCount = 0;
let confirming = false;

function renderCodeInput(){
  const el = document.getElementById('content');
  el.innerHTML =
    '<div class="card">' +
      '<div class="sec-title">กรอกรหัสที่ได้รับจากผู้ประสานงาน</div>' +
      '<input type="tel" inputmode="numeric" maxlength="6" class="code-input" id="codeInput" placeholder="XXXXXX">' +
      '<div class="hint">รหัส 6 หลักที่หน่วยงานผู้เชิญแจ้งไว้</div>' +
      '<button class="confirm-btn" id="lookupBtn" disabled onclick="lookup()">ค้นหา</button>' +
      '<div id="errArea"></div>' +
    '</div>';
  const input = document.getElementById('codeInput');
  const btn = document.getElementById('lookupBtn');
  input.oninput = function(){
    input.value = input.value.replace(/[^0-9]/g,'').slice(0,6);
    btn.disabled = input.value.length !== 6;
  };
  input.focus();
}

async function lookup(){
  const code = document.getElementById('codeInput').value;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card"><div class="loading">กำลังตรวจสอบรหัส…</div></div>';
  try{
    const res = await sb.from('guest_passes').select('*').eq('pass_code', code).maybeSingle();
    if(res.error) throw res.error;
    const data = res.data;
    if(!data){
      renderCodeInput();
      document.getElementById('errArea').innerHTML = '<div class="error">ไม่พบรหัสนี้ในระบบ กรุณาตรวจสอบรหัสอีกครั้ง</div>';
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    if(data.visit_date !== today){
      renderCodeInput();
      const visitLabel = new Date(data.visit_date+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
      document.getElementById('errArea').innerHTML = '<div class="error">รหัสนี้ใช้ได้เฉพาะวันที่ ' + visitLabel + ' เท่านั้น (วันนี้ไม่ตรงกับวันที่อนุมัติ)</div>';
      return;
    }
    currentPass = data;
    await checkQuota();
  }catch(e){
    console.error(e);
    renderCodeInput();
    document.getElementById('errArea').innerHTML = '<div class="error">ตรวจสอบไม่สำเร็จ: ' + (e && e.message ? e.message : e) + '</div>';
  }
}

async function checkQuota(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card"><div class="loading">กำลังตรวจสอบโควตา…</div></div>';
  try{
    const res = await sb.from('guest_checkins').select('id').eq('pass_id', currentPass.id);
    if(res.error) throw res.error;
    usedCount = res.data.length;
  }catch(e){ console.error(e); usedCount = 0; }

  const remaining = currentPass.guest_count_approved - usedCount;
  const full = remaining <= 0;

  let bodyHtml;
  if(full){
    bodyHtml = '<div class="error">\ud83d\udd12 ครบจำนวนที่อนุมัติแล้ว (' + usedCount + '/' + currentPass.guest_count_approved + ' คน) ไม่สามารถเช็คอินเพิ่มได้ กรุณาติดต่อผู้ประสานงาน</div>';
  }else{
    bodyHtml = '<div class="info-box">เหลือโควตาวันนี้: ' + remaining + '/' + currentPass.guest_count_approved + ' คน</div>' +
      '<input type="text" class="name-input" id="guestName" placeholder="ชื่อแขก (ไม่บังคับ)">' +
      '<button class="confirm-btn" id="confirmBtn" onclick="confirmCheckin()">ยืนยันรับอาหาร มื้อ' + period + '</button>';
  }

  el.innerHTML =
    '<div class="card">' +
      '<div class="sec-title">' + currentPass.request_unit + '</div>' +
      bodyHtml +
      '<button class="link-btn" onclick="renderCodeInput()">กรอกรหัสใหม่</button>' +
    '</div>';
}

async function confirmCheckin(){
  if(confirming) return;
  confirming = true;
  const btn = document.getElementById('confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'กำลังบันทึก…'; }
  const nameEl = document.getElementById('guestName');
  const guestName = nameEl ? nameEl.value.trim() : '';
  const el = document.getElementById('content');
  try{
    const res1 = await sb.from('guest_checkins').select('id').eq('pass_id', currentPass.id);
    if(res1.error) throw res1.error;
    if(res1.data.length >= currentPass.guest_count_approved){
      await checkQuota();
      return;
    }
    const res2 = await sb.from('guest_checkins').insert({
      pass_id: currentPass.id,
      guest_name: guestName,
      meal_period: period,
      checkin_date: new Date().toISOString().slice(0,10),
    });
    if(res2.error) throw res2.error;
    const now = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
    el.innerHTML =
      '<div class="card"><div class="success">' +
        '<div class="seal">' + CHECK_ICON + '</div>' +
        '<h2>เช็คอินสำเร็จ</h2>' +
        '<p>' + currentPass.request_unit + (guestName ? (' \u2014 ' + guestName) : '') + '</p>' +
        '<div class="time">รับอาหารมื้อ' + period + ' เวลา ' + now + ' น. (คนที่ ' + (res1.data.length+1) + '/' + currentPass.guest_count_approved + ')</div>' +
        '<button class="btn-outline" onclick="renderCodeInput()">เช็คอินแขกคนถัดไป</button>' +
      '</div></div>';
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="card"><div class="error">บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : e) + '</div>' +
      '<button class="btn-outline" onclick="checkQuota()" style="display:block;margin:14px auto 0;">ลองใหม่</button></div>';
  }finally{
    confirming = false;
  }
}

renderCodeInput();
</script>
</body>
</html>
