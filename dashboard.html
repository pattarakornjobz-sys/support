<!DOCTYPE html>
<html lang="th">
<head>

<style>
  :root{
    --bg:#EAF4FB; --bg-2:#DCEEFC;
    --gold:#3B9AE1; --gold-light:#8FD3F4; --gold-dim: rgba(59,154,225,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EAF4FB;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
    --food:#1E9E93; --food-bg:#DFF7F3; --food-text:#0F766E;
    --service:#5B6FE0; --service-bg:#E9ECFC; --service-text:#4451C7;
    --l5:#22C55E; --l4:#86D99C; --l3:#FFC857; --l2:#FF9F68; --l1:#FF6B6B;
    --silver:#B7B6AA; --bronze:#B5732E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(143,211,244,0.55), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(219,240,255,0.7), transparent 50%);
    padding:30px 12px 60px;
    font-size:16px; line-height:1.6;
  }
  .wrap{max-width:648px; margin:0 auto; padding:26px 16px 30px;}
  .eyebrow{display:flex; align-items:center; justify-content:center; gap:8px; color:#2E6FA8; font-size:13px; letter-spacing:3px; font-weight:700; text-align:center; margin-bottom:10px;}
  .eyebrow svg{width:16px; height:16px;}
  h1{
    font-family:'Prompt',sans-serif; font-size:24px; font-weight:900; margin:0 0 4px; text-align:center; line-height:1.45;
    background:linear-gradient(180deg,#3B9AE1,#1F5FA8); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 6px;}
  .vendor-note{text-align:center; font-size:12.5px; color:#2E6FA8; margin:0 auto 16px; line-height:1.6; max-width:440px; padding:9px 14px; border:1px solid rgba(59,154,225,0.3); border-radius:8px; background:rgba(59,154,225,0.06);}
  .updated{text-align:center; font-size:12.5px; color:rgba(251,246,234,0.65); margin-bottom:20px;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(59,154,225,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:18px;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .sec-icon{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sec-icon svg{width:19px; height:19px;}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:17px; line-height:1.3;}
  .error{display:flex; align-items:center; gap:8px; color:#D64550; background:#FFE8E8; border:1px solid #FFC9C9; padding:10px 12px; border-radius:6px; font-size:14px; font-weight:600; margin-bottom:14px;}
  .refresh-btn{margin-top:12px; padding:9px 16px; border-radius:8px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;}
  .empty-state{text-align:center; font-size:15px; padding:30px 0; color:var(--ink-soft);}
  .loading{text-align:center; color:#2E6FA8; padding:40px; font-size:15px;}

  .seal-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:6px;}
  .seal{
    width:132px; height:132px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--ivory-dim); border:2px solid var(--gold);
    box-shadow:0 0 0 5px rgba(59,154,225,0.14), 0 10px 26px rgba(0,0,0,0.15);
  }
  .seal .score{font-family:'Kanit',sans-serif; font-weight:700; font-size:40px; color:var(--ink); line-height:1;}
  .seal .label{font-size:12px; font-weight:700; letter-spacing:1px; color:var(--gold); margin-top:4px; text-transform:uppercase;}
  .seal-sub{font-size:13.5px; color:var(--ink-soft); margin-top:12px;}
  .kpi-row{display:flex; gap:10px; margin-top:20px;}
  .kpi{flex:1; background:var(--ivory-dim); border-radius:9px; padding:14px 8px; text-align:center;}
  .kpi .icon{width:26px; height:26px; margin:0 auto 6px; color:var(--gold);}
  .kpi .num{font-family:'Kanit',sans-serif; font-weight:700; font-size:24px; color:var(--ink); line-height:1;}
  .kpi .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.3;}

  .unit-row{margin-bottom:16px;}
  .unit-row .head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:14.5px; margin-bottom:5px;}
  .unit-row .name{font-weight:700; line-height:1.4; display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:0; flex-wrap:wrap;}
  .unit-row .name .crown{width:15px; height:15px; color:var(--gold); flex-shrink:0;}
  .unit-row .val{font-family:'Kanit',sans-serif; font-weight:700; font-size:18px; flex:0 0 auto; white-space:nowrap;}
  .unit-row .count{font-size:12px; color:var(--ink-soft); font-weight:400;}
  .unit-track{height:10px; background:rgba(31,45,61,0.09); border-radius:5px; overflow:hidden;}
  .unit-fill{height:100%; border-radius:5px;}

  .cat-row{margin-bottom:13px;}
  .cat-head{display:flex; justify-content:space-between; gap:10px; font-size:14.5px; margin-bottom:4px;}
  .cat-head .name{font-weight:600; flex:1 1 auto; min-width:0;}
  .cat-head .val{font-family:'Kanit',sans-serif; font-weight:700; font-size:16px; flex:0 0 auto; white-space:nowrap;}
  .cat-track{height:8px; background:rgba(31,45,61,0.09); border-radius:4px; overflow:hidden;}
  .cat-fill{height:100%; border-radius:4px;}
  .cat-group{margin-bottom:20px;}
  .cat-group:last-child{margin-bottom:0;}
  .cat-group-head{display:flex; align-items:center; gap:9px; margin-bottom:12px;}
  .cat-group-head .chip{width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cat-group-head .chip svg{width:15px; height:15px;}
  .cat-group-head .lbl{font-size:13.5px; font-weight:700; color:var(--ink);}

  .wish-tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .wish-tab{padding:7px 13px; border-radius:20px; border:1px solid rgba(31,45,61,0.18); background:transparent; font-size:13px; cursor:pointer; font-family:inherit; color:var(--ink); font-weight:600;}
  .wish-tab.active{background:var(--ink); border-color:var(--ink); color:var(--ivory);}
  .wish-item{display:flex; align-items:center; gap:12px; margin-bottom:11px;}
  .wish-rank{width:26px; height:26px; border-radius:50%; color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'Kanit',sans-serif; background:var(--ink-soft);}
  .wish-rank.r1{background:var(--gold); color:var(--ink);}
  .wish-rank.r2{background:var(--silver); color:var(--ink);}
  .wish-rank.r3{background:var(--bronze); color:#fff;}
  .wish-name{flex:1 1 auto; min-width:0; font-size:15px; font-weight:600;}
  .wish-count{font-family:'Kanit',sans-serif; font-size:16px; color:var(--l1); font-weight:700; flex:0 0 auto;}

  .comment-item{border-left:3px solid var(--l1); padding:6px 0 6px 14px; margin-bottom:14px; font-size:14.5px; line-height:1.55;}
  .comment-item .who{font-weight:700; color:var(--service-text); margin-bottom:3px; font-size:13px;}
  .comment-item .quote{color:var(--gold); font-family:Georgia,serif; font-size:22px; line-height:0; vertical-align:-6px; margin-right:3px;}

  .date-filter{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .date-pill{padding:7px 13px; border-radius:20px; border:1px solid rgba(31,45,61,0.18); background:transparent; font-size:13px; cursor:pointer; font-family:inherit; color:var(--ink); font-weight:600;}
  .date-pill.active{background:var(--ink); border-color:var(--ink); color:var(--ivory);}
  .date-custom{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px;}
  .date-custom input{padding:8px 10px; border-radius:6px; border:1.5px solid rgba(31,45,61,0.18); background:rgba(255,255,255,0.6); font-family:inherit; font-size:13px; color:var(--ink);}
  .date-range-note{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}

  .export-row{display:flex; gap:10px;}
  .export-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:8px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; transition:background .15s;}
  .export-btn:hover{background:rgba(31,45,61,0.06);}
  .export-btn:disabled{opacity:0.5; cursor:default;}
  .export-btn svg{width:17px; height:17px; flex-shrink:0;}
  .export-btn.pdf{background:var(--ink); color:var(--ivory);}
  .export-btn.pdf:hover{background:#1F5FA8;}
</style>
</head>
<body>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const TABLE = 'food_survey_responses';

if (SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')) {
  document.getElementById('viewDashboard').innerHTML =
    '<div class="card"><div class="error">ยังไม่ได้ตั้งค่า Supabase — กรุณาใส่ค่า SUPABASE_URL และ SUPABASE_ANON_KEY จริง ในไฟล์นี้ แล้วอัปโหลดใหม่</div></div>';
  throw new Error('Supabase config not set.');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

const UNITS = [
  'อาคารเรียน-รู้-เรื่องโขน',
  'แผนกนักเรียนศิลปาชีพ',
  'พิพิธภัณฑ์ศิลป์แผ่นดิน',
  'โครงการก่อสร้างศิลปาชีพ ตำบลเกาะเกิด',
  'อาคารศิลปาชีพ ตำบลช้างใหญ่',
  'อาคารเก็บผลิตภัณฑ์ศิลปาชีพ',
  'บุคคลอื่นๆ ที่มาใช้บริการ (โปรดระบุ)',
];
const OTHER_UNIT = 'บุคคลอื่นๆ ที่มาใช้บริการ (โปรดระบุ)';
const UNITS_SHORT = Object.fromEntries(UNITS.map(u => [u, u]));
function displayUnit(r){
  return r.unit === OTHER_UNIT ? `อื่นๆ: ${r.other_unit_name || '-'}` : (UNITS_SHORT[r.unit] || r.unit);
}
const FOOD_CATS = [
  { key:'taste', label:'รสชาติของอาหารโดยรวม' },
  { key:'freshness', label:'ความสด สะอาด และคุณภาพของวัตถุดิบ' },
  { key:'variety', label:'ความหลากหลายของรายการอาหาร' },
  { key:'presentation', label:'ความน่ารับประทานและการจัดตกแต่งอาหาร' },
  { key:'quantity', label:'ปริมาณอาหารมีความเหมาะสม และเพียงพอต่อมื้อรับประทาน' },
];
const SERVICE_CATS = [
  { key:'politeness', label:'ความสุภาพและมีมารยาทของผู้ให้บริการ' },
  { key:'speed', label:'ความรวดเร็วและความคล่องตัวในการให้บริการ' },
  { key:'cleanliness', label:'ความสะอาดของภาชนะ โต๊ะ และบริเวณรับประทานอาหาร' },
  { key:'attentiveness', label:'การเอาใจใส่และความพร้อมในการให้บริการ' },
  { key:'overall', label:'ความพึงพอใจโดยรวมต่ออาหารและการบริการ' },
];
const ALL_CATS = [...FOOD_CATS, ...SERVICE_CATS];
const WISH_FIELDS = [
  { key:'savory_suggestions', label:'อาหารคาว' },
  { key:'dessert_suggestions', label:'ของหวาน' },
  { key:'snack_suggestions', label:'ของทานเล่น' },
  { key:'other_menu_suggestions', label:'เมนูอื่น ๆ' },
];

const ICONS = {
  building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-4h6v4"/><path d="M8 7h1M11 7h1M14 7h1M8 11h1M11 11h1M14 11h1"/></svg>',
  bowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 6 0 0 1-18 0Z"/><path d="M12 3c-1 1-1 2 0 3M9 3.8c-.7 1-.7 1.6 0 2.6M15 3.8c.7 1 .7 1.6 0 2.6"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c2-1 3-3 3-6a5 5 0 0 1 10 0c0 3 1 5 3 6Z"/><path d="M2 16h20"/><circle cx="12" cy="19.2" r="1.3"/></svg>',
  quill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10.5 20.5h3"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3Z"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"/><circle cx="17" cy="8.5" r="2.3"/><path d="M17 14c2.6.4 4.5 2.4 4.5 6"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8Z"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  crown: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8Z"/></svg>',
  sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M9 9v11"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>',
};

let dash = { loading:false, error:'', responses:[], wishFilter:'all', dateFilter:'all', customFrom:'', customTo:'' };

async function loadDashboard(){
  dash.loading = true; dash.error = ''; renderDashboard();
  try{
    const { data, error } = await sb.from(TABLE).select('*').order('created_at', { ascending:false });
    if(error) throw error;
    dash.responses = data || [];
    document.getElementById('updatedAt').textContent = 'อัปเดตล่าสุด: ' + new Date().toLocaleString('th-TH');
  }catch(e){
    console.error(e);
    const detail = e?.message || e?.error_description || e?.hint || (typeof e === 'string' ? e : '');
    dash.error = 'ไม่สามารถโหลดข้อมูลสรุปผลได้: ' + (detail || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ');
  }finally{
    dash.loading = false;
    renderDashboard();
  }
}

function getFilteredResponses(){
  const all = dash.responses;
  if(dash.dateFilter === 'all') return all;
  let from = null, to = null;
  const now = new Date();
  if(dash.dateFilter === 'today'){
    from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  } else if(dash.dateFilter === '7d'){
    from = new Date(now.getTime() - 7*24*60*60*1000);
  } else if(dash.dateFilter === '30d'){
    from = new Date(now.getTime() - 30*24*60*60*1000);
  } else if(dash.dateFilter === 'custom'){
    if(dash.customFrom) from = new Date(dash.customFrom + 'T00:00:00');
    if(dash.customTo) to = new Date(dash.customTo + 'T23:59:59');
  }
  return all.filter(r => {
    const t = new Date(r.created_at);
    if(from && t < from) return false;
    if(to && t > to) return false;
    return true;
  });
}

function computeStats(responses){
  const total = responses.length;
  let sum=0, n=0;
  responses.forEach(r => ALL_CATS.forEach(c => { const v=r.ratings?.[c.key]; if(v>0){sum+=v;n+=1;} }));
  const overallAvg = n ? sum/n : 0;

  const categoryAverages = ALL_CATS.map(c => {
    const vals = responses.map(r => r.ratings?.[c.key]).filter(v => v>0);
    return { key:c.key, label:c.label, avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0 };
  });

  const unitStats = UNITS.map(u => {
    const list = responses.filter(r => r.unit === u);
    let s=0, cnt=0;
    list.forEach(r => ALL_CATS.forEach(c => { const v=r.ratings?.[c.key]; if(v>0){s+=v;cnt+=1;} }));
    const otherNames = u === OTHER_UNIT
      ? [...new Set(list.map(r => r.other_unit_name).filter(Boolean))]
      : [];
    return { unit:u, short:UNITS_SHORT[u], count:list.length, avg: cnt ? s/cnt : 0, otherNames };
  });

  function tally(fieldKeys){
    const freq = {};
    responses.forEach(r => {
      fieldKeys.forEach(fk => {
        const txt = r[fk];
        if(!txt) return;
        txt.split(/[,\n،、]/).map(s=>s.trim()).filter(Boolean).forEach(item => {
          const key = item.toLowerCase();
          if(!freq[key]) freq[key] = { label:item, count:0 };
          freq[key].count += 1;
        });
      });
    });
    return Object.values(freq).sort((a,b)=>b.count-a.count).slice(0,10);
  }
  const wishlists = {
    all: tally(WISH_FIELDS.map(f=>f.key)),
    savory_suggestions: tally(['savory_suggestions']),
    dessert_suggestions: tally(['dessert_suggestions']),
    snack_suggestions: tally(['snack_suggestions']),
    other_menu_suggestions: tally(['other_menu_suggestions']),
  };

  const recentComments = responses.filter(r => r.additional_comments).slice(0,6);
  const bestUnit = unitStats.filter(u=>u.count>0).sort((a,b)=>b.avg-a.avg)[0];

  return { total, overallAvg, categoryAverages, unitStats, wishlists, recentComments, bestUnit };
}

function stampLabel(s){
  return s>=4.5?'เยี่ยมยอด' : s>=3.5?'พอใจดี' : s>=2.5?'ปานกลาง' : 'ควรปรับปรุง';
}
function catColor(avg){
  return avg>=4.5?'var(--l5)': avg>=3.5?'var(--l4)': avg>=2.5?'var(--l3)': avg>=1.5?'var(--l2)':'var(--l1)';
}
function setWishFilter(key){ dash.wishFilter = key; renderDashboard(); }
function setDateFilter(key){ dash.dateFilter = key; renderDashboard(); }
function setCustomDate(which, val){
  if(which==='from') dash.customFrom = val; else dash.customTo = val;
  dash.dateFilter = 'custom';
  renderDashboard();
}

function dateRangeLabel(){
  if(dash.dateFilter==='today') return 'วันนี้';
  if(dash.dateFilter==='7d') return '7 วันล่าสุด';
  if(dash.dateFilter==='30d') return '30 วันล่าสุด';
  if(dash.dateFilter==='custom') return `${dash.customFrom || '…'} ถึง ${dash.customTo || '…'}`;
  return 'ทั้งหมด';
}

function exportExcel(){
  const filtered = getFilteredResponses();
  if(!filtered.length){ alert('ไม่มีข้อมูลในช่วงเวลาที่เลือก'); return; }
  const rows = filtered.map(r => {
    const row = {
      'วันที่ส่ง': new Date(r.created_at).toLocaleString('th-TH'),
      'ชื่อ-นามสกุล': r.respondent_name || '',
      'เบอร์ติดต่อ': r.respondent_phone || '',
      'หน่วยงาน': displayUnit(r),
    };
    ALL_CATS.forEach(c => { row[c.label] = r.ratings?.[c.key] ?? ''; });
    row['11. อาหารคาวที่อยากเพิ่ม'] = r.savory_suggestions || '';
    row['12. ของหวานที่อยากเพิ่ม'] = r.dessert_suggestions || '';
    row['13. ของทานเล่นที่อยากเพิ่ม'] = r.snack_suggestions || '';
    row['14. เมนูอื่นๆที่แนะนำ'] = r.other_menu_suggestions || '';
    row['15. ข้อเสนอแนะเพิ่มเติม'] = r.additional_comments || '';
    return row;
  });
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.min(Math.max(k.length, 14), 40) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'แบบประเมิน');
    XLSX.writeFile(wb, `แบบประเมินความพึงพอใจ_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){
    console.error(e);
    alert('สร้างไฟล์ Excel ไม่สำเร็จ: ' + (e?.message || e));
  }
}

function sizedIcon(name, size){
  return ICONS[name].replace('<svg ', `<svg width="${size}" height="${size}" `);
}

function printSectionHead(iconName, bg, color, title, sub){
  return `<div style="display:flex; align-items:center; gap:12px; margin:0 0 16px;">
    <div style="width:36px;height:36px;border-radius:50%;background:${bg};color:${color};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${sizedIcon(iconName,18)}</div>
    <div><div style="font-family:'Prompt',sans-serif;font-weight:700;font-size:16px;color:#1F2D3D;">${title}</div>${sub?`<div style="font-size:11.5px;color:#5B6B85;margin-top:1px;">${sub}</div>`:''}</div>
  </div>`;
}

function printBarRow(label, valueLabel, pct, color, sub){
  return `<div style="margin-bottom:13px;">
    <div style="display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:4px;">
      <span style="font-weight:600; color:#1F2D3D;">${label}</span>
      <span style="font-weight:700; color:#1F2D3D; flex-shrink:0;">${valueLabel}</span>
    </div>
    <div style="height:9px; background:rgba(31,45,61,0.08); border-radius:5px; overflow:hidden;">
      <div style="height:100%; width:${pct}%; background:${color}; border-radius:5px;"></div>
    </div>
    ${sub ? `<div style="font-size:11px;color:#5B6B85;margin-top:3px;">${sub}</div>` : ''}
  </div>`;
}

function printPageShell(bodyHtml, pageNum, totalPages){
  const div = document.createElement('div');
  div.style.cssText = 'position:absolute; left:-9999px; top:0; width:794px; min-height:1123px; background:#FFFFFF; font-family:"Kanit",sans-serif; color:#1F2D3D; box-sizing:border-box; padding:50px 50px 36px; display:flex; flex-direction:column;';
  div.innerHTML = `
    <div style="flex:1;">${bodyHtml}</div>
    <div style="margin-top:20px; padding-top:14px; border-top:1px solid rgba(31,45,61,0.12); display:flex; justify-content:space-between; font-size:10.5px; color:#5B6B85;">
      <span>รายงานความพึงพอใจ ด้านอาหารและการบริการ — ร้าน Rus Hotel ครัวกลาง</span>
      <span>หน้า ${pageNum}/${totalPages}</span>
    </div>`;
  return div;
}

function printReportHeader(s){
  return `
    <div style="border-top:4px solid #3B9AE1; margin-bottom:22px;"></div>
    <div style="text-align:center; color:#3B9AE1; font-size:12px; letter-spacing:2px; font-weight:700; margin-bottom:8px;">รายงานสำหรับผู้บริหาร</div>
    <div style="text-align:center; font-family:'Prompt',sans-serif; font-weight:900; font-size:24px; margin-bottom:8px;">สรุปผลความพึงพอใจ ด้านอาหารและการบริการ</div>
    <div style="text-align:center; font-size:12.5px; color:#5B6B85; margin-bottom:16px;">อาหารจากร้าน Rus Hotel ผู้ดำเนินการครัวกลาง — สวัสดิการเจ้าหน้าที่ เริ่ม 9 ส.ค. 2569</div>
    <div style="display:flex; justify-content:center; gap:28px; font-size:12.5px; font-weight:600; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid rgba(31,45,61,0.12);">
      <span>ช่วงเวลา: ${dateRangeLabel()}</span>
      <span>จำนวนแบบประเมิน: ${s.total} ฉบับ</span>
      <span>สร้างเมื่อ: ${new Date().toLocaleString('th-TH')}</span>
    </div>`;
}

async function exportPDF(){
  const filtered = getFilteredResponses();
  if(!filtered.length){ alert('ไม่มีข้อมูลในช่วงเวลาที่เลือก'); return; }
  const btn = document.getElementById('pdfBtn');
  const originalLabel = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = 'กำลังสร้าง PDF…';

  const s = computeStats(filtered);
  const pages = [];

  // ---------- Page 1: overview ----------
  const scoreColor = catColor(s.overallAvg);
  let p1 = printReportHeader(s);
  p1 += `<div style="display:flex; gap:28px; align-items:center; margin-bottom:32px;">
    <div style="width:150px;height:150px;border-radius:50%;border:3px solid #3B9AE1;box-shadow:0 0 0 6px rgba(59,154,225,0.12); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0;">
      <div style="font-size:48px; font-weight:700;">${s.overallAvg.toFixed(1)}</div>
      <div style="font-size:12px; font-weight:700; letter-spacing:1px; color:#3B9AE1; text-transform:uppercase;">${stampLabel(s.overallAvg)}</div>
    </div>
    <div style="flex:1;">
      <div style="font-family:'Prompt',sans-serif; font-weight:700; font-size:17px; margin-bottom:10px;">คะแนนความพึงพอใจโดยรวม</div>
      ${s.bestUnit ? `<div style="font-size:13.5px; margin-bottom:6px;">หน่วยงานยอดเยี่ยม: <strong>${s.bestUnit.short}</strong> (${s.bestUnit.avg.toFixed(1)})</div>` : ''}
      <div style="display:flex; gap:14px; margin-top:14px;">
        <div style="flex:1; background:#EAF4FB; border-radius:8px; padding:12px; text-align:center;"><div style="font-size:22px;font-weight:700;">${s.total}</div><div style="font-size:11px;color:#5B6B85;">แบบประเมิน</div></div>
        <div style="flex:1; background:#EAF4FB; border-radius:8px; padding:12px; text-align:center;"><div style="font-size:22px;font-weight:700;">${s.overallAvg.toFixed(1)}</div><div style="font-size:11px;color:#5B6B85;">คะแนนเฉลี่ย</div></div>
        <div style="flex:1; background:#EAF4FB; border-radius:8px; padding:12px; text-align:center;"><div style="font-size:22px;font-weight:700;">${s.unitStats.filter(u=>u.count>0).length}/${s.unitStats.length}</div><div style="font-size:11px;color:#5B6B85;">หน่วยงานตอบแล้ว</div></div>
      </div>
    </div>
  </div>`;
  p1 += printSectionHead('chart','#EAF4FB','#5B6B85','คะแนนเฉลี่ยแยกตามหน่วยงาน');
  p1 += s.unitStats.map(u => printBarRow(
    (u.unit===s.bestUnit?.unit?'★ ':'') + u.short,
    u.count ? u.avg.toFixed(1) : '-',
    u.count ? (u.avg/5*100) : 1,
    u.count ? catColor(u.avg) : '#DCEEFC',
    u.count ? `${u.count} ฉบับ` : 'ยังไม่มีข้อมูล'
  )).join('');
  pages.push(p1);

  // ---------- Page 2: category breakdown ----------
  let p2 = printSectionHead('bowl','#DFF7F3','#0F766E','คะแนนเฉลี่ยแยกตามหัวข้อ — ด้านอาหาร','ข้อ 1–5');
  p2 += FOOD_CATS.map(c => {
    const cs = s.categoryAverages.find(x=>x.key===c.key);
    return printBarRow(c.label, cs.avg.toFixed(2), cs.avg/5*100, catColor(cs.avg));
  }).join('');
  p2 += `<div style="height:14px;"></div>`;
  p2 += printSectionHead('bell','#E9ECFC','#4451C7','คะแนนเฉลี่ยแยกตามหัวข้อ — ด้านการบริการ','ข้อ 6–10');
  p2 += SERVICE_CATS.map(c => {
    const cs = s.categoryAverages.find(x=>x.key===c.key);
    return printBarRow(c.label, cs.avg.toFixed(2), cs.avg/5*100, catColor(cs.avg));
  }).join('');
  pages.push(p2);

  // ---------- Page 3: wishlist + comments ----------
  const topWish = s.wishlists.all.slice(0,10);
  const rankColors = ['#3B9AE1','#B7B6AA','#B5732E'];
  let p3 = '';
  if(topWish.length){
    p3 += printSectionHead('quill','#FFF3D6','#92600A','เมนูที่มีผู้เสนอมากที่สุด','ข้อ 11–14 รวมทุกหมวด');
    p3 += topWish.map((w,i) => `
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;">
        <div style="width:24px;height:24px;border-radius:50%;background:${rankColors[i]||'#5B6B85'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${i+1}</div>
        <div style="flex:1; font-size:13.5px; font-weight:600;">${w.label}</div>
        <div style="font-size:13.5px; font-weight:700; color:#FF6B6B;">×${w.count}</div>
      </div>`).join('');
    p3 += `<div style="height:20px;"></div>`;
  }
  if(s.recentComments.length){
    p3 += printSectionHead('quill','#FFE8E8','#FF6B6B','ข้อเสนอแนะเพิ่มเติมล่าสุด','ข้อ 15');
    p3 += s.recentComments.map(r => `
      <div style="border-left:3px solid #FF6B6B; padding:2px 0 2px 14px; margin-bottom:14px;">
        <div style="font-size:12px; font-weight:700; color:#4451C7; margin-bottom:2px;">${displayUnit(r)}</div>
        <div style="font-size:13px; line-height:1.5;">${r.additional_comments}</div>
      </div>`).join('');
  }
  if(p3) pages.push(p3);

  const total = pages.length;
  const shells = pages.map((html,i) => printPageShell(html, i+1, total));
  shells.forEach(s => document.body.appendChild(s));

  try{
    const canvases = await Promise.all(shells.map(el => html2canvas(el, { scale: 2, backgroundColor: '#FFFFFF', windowWidth: el.scrollWidth, windowHeight: el.scrollHeight })));
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    let firstPage = true;
    canvases.forEach((canvas) => {
      const imgData = canvas.toDataURL('image/png');
      const imgH = canvas.height * pageW / canvas.width;
      if(!firstPage) pdf.addPage();
      firstPage = false;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, pageW, imgH);
      let heightLeft = imgH - pageH;
      while(heightLeft > 0){
        pdf.addPage();
        position = heightLeft - imgH;
        pdf.addImage(imgData, 'PNG', 0, position, pageW, imgH);
        heightLeft -= pageH;
      }
    });
    pdf.save(`สรุปผลความพึงพอใจ_${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(e){
    console.error(e);
    alert('สร้าง PDF ไม่สำเร็จ: ' + (e?.message || e));
  }finally{
    shells.forEach(el => document.body.removeChild(el));
    btn.disabled = false; btn.innerHTML = originalLabel;
  }
}

function renderDashboard(){
  const el = document.getElementById('viewDashboard');
  if(dash.loading){ el.innerHTML = `<div class="loading">กำลังโหลดข้อมูล…</div>`; return; }
  if(dash.error){
    el.innerHTML = `<div class="card"><div class="error">${dash.error}</div><button class="refresh-btn" onclick="loadDashboard()">ลองใหม่</button></div>`;
    return;
  }
  if(dash.responses.length === 0){
    el.innerHTML = `<div class="card"><div class="empty-state">ยังไม่มีแบบประเมินเข้ามา</div></div>`;
    return;
  }

  const dateFilterHtml = `
    <div class="card">
      <div class="sec-head">
        <div class="sec-icon" style="background:var(--ivory-dim); color:var(--ink-soft);">${ICONS.chart}</div>
        <div><div class="sec-title">ช่วงเวลาที่แสดงผล</div></div>
      </div>
      <div class="date-filter">
        <button class="date-pill ${dash.dateFilter==='today'?'active':''}" onclick="setDateFilter('today')">วันนี้</button>
        <button class="date-pill ${dash.dateFilter==='7d'?'active':''}" onclick="setDateFilter('7d')">7 วันล่าสุด</button>
        <button class="date-pill ${dash.dateFilter==='30d'?'active':''}" onclick="setDateFilter('30d')">30 วันล่าสุด</button>
        <button class="date-pill ${dash.dateFilter==='all'?'active':''}" onclick="setDateFilter('all')">ทั้งหมด</button>
        <button class="date-pill ${dash.dateFilter==='custom'?'active':''}" onclick="setDateFilter('custom')">กำหนดเอง</button>
      </div>
      ${dash.dateFilter==='custom' ? `
      <div class="date-custom">
        <span>จาก</span>
        <input type="date" value="${dash.customFrom}" onchange="setCustomDate('from', this.value)">
        <span>ถึง</span>
        <input type="date" value="${dash.customTo}" onchange="setCustomDate('to', this.value)">
      </div>` : ''}
    </div>`;

  const filtered = getFilteredResponses();
  if(filtered.length === 0){
    el.innerHTML = dateFilterHtml + `<div class="card"><div class="empty-state">ไม่มีแบบประเมินในช่วงเวลาที่เลือก</div></div>`;
    return;
  }
  const s = computeStats(filtered);

  const unitRows = s.unitStats.map(u => `
    <div class="unit-row">
      <div class="head">
        <span class="name">${u.unit === s.bestUnit?.unit ? `<span class="crown">${ICONS.crown}</span>` : ''}${u.short}${u.count ? ` <span class="count">(${u.count} ฉบับ)</span>` : ''}</span>
        <span class="val">${u.count?u.avg.toFixed(1):'-'}</span>
      </div>
      <div class="unit-track"><div class="unit-fill" style="width:${u.count?(u.avg/5*100):2}%; background:${u.count?catColor(u.avg):'var(--ivory-dim)'}"></div></div>
      ${u.otherNames && u.otherNames.length ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">ระบุ: ${u.otherNames.join(', ')}</div>` : ''}
    </div>`).join('');

  function catBarsFor(cats){
    return cats.map(key => {
      const c = s.categoryAverages.find(x => x.key === key);
      return `
      <div class="cat-row">
        <div class="cat-head"><span class="name">${c.label}</span><span class="val">${c.avg.toFixed(2)}</span></div>
        <div class="cat-track"><div class="cat-fill" style="width:${(c.avg/5*100)}%; background:${catColor(c.avg)}"></div></div>
      </div>`;
    }).join('');
  }

  const wishTabs = [{key:'all',label:'ทั้งหมด'}, ...WISH_FIELDS].map(f => `
    <button class="wish-tab ${dash.wishFilter===f.key?'active':''}" onclick="setWishFilter('${f.key}')">${f.label}</button>
  `).join('');
  const activeWish = s.wishlists[dash.wishFilter] || [];
  const rankClass = i => i===0?'r1':i===1?'r2':i===2?'r3':'';
  const wishHtml = activeWish.length === 0
    ? `<div style="font-size:14px;color:var(--ink-soft);">ยังไม่มีข้อเสนอในหมวดนี้</div>`
    : activeWish.map((w,i) => `
      <div class="wish-item">
        <div class="wish-rank ${rankClass(i)}">${i+1}</div>
        <div class="wish-name">${w.label}</div>
        <div class="wish-count">×${w.count}</div>
      </div>`).join('');

  const commentsHtml = s.recentComments.length === 0 ? '' : `
    <div class="card">
      <div class="sec-head">
        <div class="sec-icon" style="background:#FFE8E8; color:var(--l1);">${ICONS.quill}</div>
        <div><div class="sec-title">ข้อ 15 · ข้อเสนอแนะเพิ่มเติมล่าสุด</div></div>
      </div>
      ${s.recentComments.map(r => `
        <div class="comment-item">
          <div class="who">${displayUnit(r)}</div>
          <div><span class="quote">“</span>${r.additional_comments}</div>
        </div>`).join('')}
    </div>`;

  el.innerHTML = dateFilterHtml + `
    <div class="card">
      <div class="export-row">
        <button class="export-btn" id="excelBtn" onclick="exportExcel()">${ICONS.sheet} Excel รายชื่อผู้ประเมิน</button>
        <button class="export-btn pdf" id="pdfBtn" onclick="exportPDF()">${ICONS.doc} PDF รายงานสรุป</button>
      </div>
    </div>
    <div id="reportContent">
    <div class="card">
      <div class="seal-wrap">
        <div class="seal"><div class="score">${s.overallAvg.toFixed(1)}</div><div class="label">${stampLabel(s.overallAvg)}</div></div>
        ${s.bestUnit ? `<div class="seal-sub">หน่วยงานยอดเยี่ยม: <strong>${s.bestUnit.short}</strong> (${s.bestUnit.avg.toFixed(1)})</div>` : ''}
      </div>
      <div class="kpi-row">
        <div class="kpi"><div class="icon">${ICONS.users}</div><div class="num">${s.total}</div><div class="lbl">แบบประเมิน${dash.dateFilter==='all'?'ทั้งหมด':'ในช่วงนี้'}</div></div>
        <div class="kpi"><div class="icon">${ICONS.star}</div><div class="num">${s.overallAvg.toFixed(1)}</div><div class="lbl">คะแนนเฉลี่ยรวม</div></div>
        <div class="kpi"><div class="icon">${ICONS.building}</div><div class="num">${s.unitStats.filter(u=>u.count>0).length}/6</div><div class="lbl">หน่วยงานที่ตอบแล้ว</div></div>
      </div>
      <button class="refresh-btn" onclick="loadDashboard()">↻ รีเฟรชข้อมูล</button>
    </div>

    <div class="card">
      <div class="sec-head">
        <div class="sec-icon" style="background:var(--ivory-dim); color:var(--ink-soft);">${ICONS.chart}</div>
        <div><div class="sec-title">คะแนนเฉลี่ยแยกตามหน่วยงาน</div></div>
      </div>
      ${unitRows}
    </div>

    <div class="card">
      <div class="sec-head">
        <div class="sec-icon" style="background:var(--ivory-dim); color:var(--ink-soft);">${ICONS.chart}</div>
        <div><div class="sec-title">คะแนนเฉลี่ยแยกตามหัวข้อ (ข้อ 1-10)</div></div>
      </div>
      <div class="cat-group">
        <div class="cat-group-head"><span class="chip" style="background:var(--food-bg); color:var(--food-text);">${ICONS.bowl}</span><span class="lbl">ด้านอาหาร</span></div>
        ${catBarsFor(FOOD_CATS.map(c=>c.key))}
      </div>
      <div class="cat-group">
        <div class="cat-group-head"><span class="chip" style="background:var(--service-bg); color:var(--service-text);">${ICONS.bell}</span><span class="lbl">ด้านการบริการ</span></div>
        ${catBarsFor(SERVICE_CATS.map(c=>c.key))}
      </div>
    </div>

    <div class="card">
      <div class="sec-head">
        <div class="sec-icon" style="background:#FFF3D6; color:#92600A;">${ICONS.quill}</div>
        <div><div class="sec-title">เมนูที่มีผู้เสนอมากที่สุด (ข้อ 11-14)</div></div>
      </div>
      <div class="wish-tabs">${wishTabs}</div>
      ${wishHtml}
    </div>

    ${commentsHtml}
    </div>
  `;
}

loadDashboard();
</script>
