<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ยืนยันรับอาหารกล่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
    --good:#22C55E; --good-bg:#E7F9EE;
    --warn:#FFC857; --warn-bg:#FFF6E0;
    --bad:#FF6B6B; --bad-bg:#FFE8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px; font-size:16px; line-height:1.6; min-height:100vh;
  }
  .wrap{max-width:500px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(18px, 6vw, 22px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 20px;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:16px; text-align:center;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px; margin-bottom:14px;}
  .phone-input{
    width:100%; padding:16px; border-radius:12px; border:1.5px solid rgba(31,45,61,0.16);
    background:var(--ivory-dim); font-family:'Kanit',sans-serif; font-size:22px; letter-spacing:2px;
    text-align:center; color:var(--ink); font-weight:700;
  }
  .phone-input:focus{outline:none; border-color:var(--gold);}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:8px;}
  .confirm-btn{
    width:100%; margin-top:16px; padding:16px; border-radius:12px; border:none;
    background:linear-gradient(180deg,#D9A628,#B8860B); color:#fff; font-weight:700; font-size:16px;
    cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(217,166,40,0.4);
  }
  .confirm-btn:disabled{background:#B9C6D4; box-shadow:none; cursor:default;}
  .req-item{background:var(--ivory-dim); border-radius:14px; padding:16px; margin-bottom:12px; text-align:left;}
  .req-item .date{font-family:'Prompt',sans-serif; font-weight:700; font-size:15px;}
  .req-item .meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .req-item .count{font-size:14px; font-weight:700; color:var(--ink); margin-top:8px;}
  .meal-pickup-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:1px dashed rgba(31,45,61,0.15);}
  .meal-pickup-row:first-of-type{border-top:none;}
  .meal-name{font-weight:600; font-size:13.5px;}
  .pickup-btn{padding:8px 16px; border-radius:8px; border:none; background:var(--gold); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .pickup-done{padding:6px 12px; border-radius:8px; background:var(--good-bg); color:#1A7A45; font-weight:700; font-size:12px;}
  .link-btn{margin-top:14px; background:none; border:none; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; font-family:inherit;}
  .error{color:#D64550; background:#FFE8E8; border:1px solid #FFC9C9; padding:12px; border-radius:10px; font-size:13.5px; font-weight:600; margin-top:10px;}
  .loading, .empty-state{color:var(--ink-soft); padding:20px 0; font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>ยืนยันรับอาหารกล่อง</h1>
  <div class="rule"></div>
  <div id="content"></div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

let matchedRequests = [];
let pickupStatus = {};
let currentPhone = '';

function renderPhoneInput(){
  const el = document.getElementById('content');
  el.innerHTML =
    '<div class="card">' +
      '<div class="sec-title">กรอกเบอร์โทรศัพท์ผู้ประสานงาน</div>' +
      '<input type="tel" inputmode="numeric" maxlength="10" class="phone-input" id="phoneInput" placeholder="08X XXX XXXX">' +
      '<div class="hint">เบอร์เดียวกับที่ระบุตอนยื่นคำขอรับการสนับสนุนจากครัวกลาง</div>' +
      '<button class="confirm-btn" id="lookupBtn" disabled onclick="lookup()">ค้นหารายการวันนี้</button>' +
      '<div id="errArea"></div>' +
    '</div>';
  const input = document.getElementById('phoneInput');
  const btn = document.getElementById('lookupBtn');
  input.oninput = function(){
    input.value = input.value.replace(/[^0-9]/g,'').slice(0,10);
    btn.disabled = input.value.length !== 10;
  };
  input.focus();
}

async function lookup(){
  const phone = document.getElementById('phoneInput').value;
  currentPhone = phone;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card"><div class="loading">กำลังค้นหารายการ…</div></div>';
  try{
    const today = new Date().toISOString().slice(0,10);
    const res = await sb.from('kitchen_support_requests').select('*')
      .eq('requester_phone', phone).eq('event_date', today).eq('service_type', 'ข้าวกล่อง');
    if(res.error) throw res.error;
    if(!res.data.length){
      renderPhoneInput();
      document.getElementById('errArea').innerHTML = '<div class="error">ไม่พบคำขอข้าวกล่องของวันนี้สำหรับเบอร์นี้ กรุณาตรวจสอบเบอร์อีกครั้ง</div>';
      return;
    }
    matchedRequests = res.data;
    await loadPickupStatus();
    renderRequests();
  }catch(e){
    console.error(e);
    renderPhoneInput();
    document.getElementById('errArea').innerHTML = '<div class="error">ค้นหาไม่สำเร็จ: ' + (e && e.message ? e.message : e) + '</div>';
  }
}

async function loadPickupStatus(){
  pickupStatus = {};
  for(const r of matchedRequests){
    const res = await sb.from('kitchen_pickup_confirmations').select('meal_period').eq('request_id', r.id);
    pickupStatus[r.id] = (res.data || []).map(function(x){ return x.meal_period; });
  }
}

function renderRequests(){
  const el = document.getElementById('content');
  const items = matchedRequests.map(function(r){
    const meals = r.meal_periods.split(',');
    const doneMeals = pickupStatus[r.id] || [];
    const mealRows = meals.map(function(m){
      const done = doneMeals.indexOf(m) !== -1;
      return '<div class="meal-pickup-row"><span class="meal-name">มื้อ' + m + '</span>' +
        (done ? '<span class="pickup-done">\u2713 รับแล้ว</span>' : '<button class="pickup-btn" onclick="confirmPickup(\''+r.id+'\',\''+m+'\')">ยืนยันรับ</button>') +
        '</div>';
    }).join('');
    return '<div class="req-item">' +
      '<div class="date">' + (r.unit + (r.other_unit_name?(': '+r.other_unit_name):'')) + '</div>' +
      '<div class="meta">ผู้ประสาน: ' + r.requester_name + '</div>' +
      '<div class="count">จำนวน ' + r.headcount + ' กล่อง' + (r.menu_detail ? (' \u00b7 '+r.menu_detail) : '') + '</div>' +
      mealRows +
    '</div>';
  }).join('');
  el.innerHTML = '<div class="card" style="text-align:left;">' + items + '</div>' +
    '<button class="link-btn" onclick="renderPhoneInput()" style="display:block;margin:0 auto;">ค้นหาเบอร์อื่น</button>';
}

async function confirmPickup(requestId, mealPeriod){
  try{
    const res = await sb.from('kitchen_pickup_confirmations').insert({
      request_id: requestId,
      meal_period: mealPeriod,
      confirmed_by: currentPhone,
    });
    if(res.error) throw res.error;
    if(!pickupStatus[requestId]) pickupStatus[requestId] = [];
    pickupStatus[requestId].push(mealPeriod);
    renderRequests();
  }catch(e){
    console.error(e);
    alert('ยืนยันไม่สำเร็จ: ' + (e && e.message ? e.message : e));
  }
}

renderPhoneInput();
</script>
</body>
</html>
