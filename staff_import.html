<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>นำเข้าข้อมูลเจ้าหน้าที่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Kanit:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0B2545; --bg-2:#12395E;
    --gold:#D9A628; --gold-light:#F0CB6C; --gold-dim: rgba(217,166,40,0.35);
    --ivory:#FFFFFF; --ivory-dim:#EEF3F8;
    --ink:#1F2D3D; --ink-soft:#5B6B85;
    --good:#22C55E; --good-bg:#E7F9EE; --bad:#FF6B6B; --bad-bg:#FFE8E8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Kanit',sans-serif; color:var(--ink);
    background:var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,166,40,0.18), transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255,255,255,0.06), transparent 50%);
    padding:30px 12px 60px; font-size:16px; line-height:1.6;
  }
  .wrap{max-width:600px; margin:0 auto;}
  h1{
    font-family:'Prompt',sans-serif; font-size:clamp(19px, 6vw, 23px); font-weight:900; margin:0 0 4px; text-align:center; line-height:1.4;
    background:linear-gradient(180deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .rule{width:70px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto 20px;}
  .card{
    position:relative; background:var(--ivory); border-radius:20px; overflow:hidden;
    box-shadow:0 10px 28px rgba(217,166,40,0.14), 0 2px 8px rgba(31,45,61,0.06);
    padding:24px 22px; margin-bottom:16px;
  }
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--gold-light),var(--gold));}
  .sec-title{font-family:'Prompt',sans-serif; font-weight:700; font-size:16px; margin-bottom:10px;}
  .hint{font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px;}
  .hint code{background:var(--ivory-dim); padding:1px 6px; border-radius:4px; font-size:12.5px;}
  .drop{border:2px dashed rgba(31,45,61,0.2); border-radius:14px; padding:30px 16px; text-align:center; cursor:pointer;}
  .drop:hover{border-color:var(--gold);}
  .drop input{display:none;}
  .drop .t{font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .drop .s{font-size:12.5px; color:var(--ink-soft);}
  .filename{margin-top:12px; font-size:13.5px; font-weight:600; text-align:center;}
  .import-btn{
    width:100%; margin-top:16px; padding:15px; border-radius:10px; border:none;
    background:linear-gradient(180deg,#D9A628,#B8860B); color:#fff; font-weight:700; font-size:15.5px;
    cursor:pointer; font-family:inherit;
  }
  .import-btn:disabled{background:#B9C6D4; cursor:default;}
  .result{margin-top:14px; padding:14px; border-radius:10px; font-size:13.5px;}
  .result.ok{background:var(--good-bg); color:#1A7A45;}
  .result.err{background:var(--bad-bg); color:#B4322F;}
  .preview-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:12px;}
  .preview-table th, .preview-table td{border:1px solid rgba(31,45,61,0.12); padding:6px 8px; text-align:left;}
  .preview-table th{background:var(--ivory-dim);}
</style>
</head>
<body>
<div class="wrap">
  <h1>นำเข้าข้อมูลเจ้าหน้าที่</h1>
  <div class="rule"></div>

  <div class="card">
    <div class="sec-title">รูปแบบไฟล์ที่รองรับ</div>
    <div class="hint">
      ไฟล์ Excel (.xlsx) หรือ CSV แถวแรกเป็นหัวคอลัมน์ ต้องมีคอลัมน์เหล่านี้ (ชื่อคอลัมน์ยืดหยุ่น ระบบจะจับคู่ให้อัตโนมัติ):<br>
      <code>เบอร์โทรศัพท์</code> · <code>ชื่อ</code> · <code>นามสกุล</code> · <code>หน่วยงาน</code> (ไม่บังคับ) · <code>เลขบัตรประชาชน</code> (ไม่บังคับ)
    </div>
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div class="t">📄 แตะเพื่อเลือกไฟล์</div>
      <div class="s">.xlsx, .xls หรือ .csv</div>
    </label>
    <div class="filename" id="fileName"></div>
    <div id="previewArea"></div>
    <button class="import-btn" id="importBtn" disabled onclick="doImport()">นำเข้าข้อมูล</button>
    <div id="resultArea"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uhefxwccuqagnbrbidbh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZWZ4d2NjdXFhZ25icmJpZGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDI1NDYsImV4cCI6MjEwMTU3ODU0Nn0.EE5QWPVjSkZpUTU37hgiz4LsGMAfq87dxFOkt9OYynY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

let parsedRows = [];

const COL_MAP = {
  phone_number: ['เบอร์โทรศัพท์','เบอร์โทร','โทรศัพท์','phone','phone_number','เบอร์'],
  id_card_number: ['เลขบัตรประชาชน','เลขประจำตัวประชาชน','id_card_number','id card','idcard','เลขบัตร'],
  first_name: ['ชื่อ','first_name','firstname','ชื่อจริง'],
  last_name: ['นามสกุล','last_name','lastname'],
  unit: ['หน่วยงาน','unit','สังกัด'],
};

function findCol(headers, candidates){
  const lower = headers.map(h => String(h).trim().toLowerCase());
  for(const c of candidates){
    const idx = lower.indexOf(c.toLowerCase());
    if(idx !== -1) return idx;
  }
  return -1;
}

document.getElementById('fileInput').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('fileName').textContent = file.name;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
  if(!rows.length){ alert('ไฟล์ว่างเปล่า'); return; }
  const headers = rows[0];
  const phoneIdx = findCol(headers, COL_MAP.phone_number);
  const idIdx = findCol(headers, COL_MAP.id_card_number);
  const fnIdx = findCol(headers, COL_MAP.first_name);
  const lnIdx = findCol(headers, COL_MAP.last_name);
  const unitIdx = findCol(headers, COL_MAP.unit);

  if(phoneIdx === -1 || fnIdx === -1 || lnIdx === -1){
    document.getElementById('previewArea').innerHTML = '<div class="result err">ไม่พบคอลัมน์ที่จำเป็น (เบอร์โทรศัพท์/ชื่อ/นามสกุล) กรุณาตรวจหัวตารางในไฟล์</div>';
    document.getElementById('importBtn').disabled = true;
    return;
  }

  parsedRows = rows.slice(1)
    .filter(r => r[phoneIdx] && String(r[phoneIdx]).trim())
    .map(r => ({
      phone_number: String(r[phoneIdx]).trim().replace(/[^0-9]/g,''),
      id_card_number: idIdx!==-1 && r[idIdx] ? String(r[idIdx]).trim().replace(/[^0-9]/g,'') : null,
      first_name: String(r[fnIdx]||'').trim(),
      last_name: String(r[lnIdx]||'').trim(),
      unit: unitIdx!==-1 ? String(r[unitIdx]||'').trim() : '',
    }))
    .filter(r => r.phone_number.length > 0);

  const previewRows = parsedRows.slice(0,5).map(r => '<tr><td>'+r.phone_number+'</td><td>'+r.first_name+'</td><td>'+r.last_name+'</td><td>'+r.unit+'</td></tr>').join('');
  document.getElementById('previewArea').innerHTML =
    '<div style="font-size:13px;font-weight:600;margin-top:14px;">พบข้อมูล ' + parsedRows.length + ' รายการ (ตัวอย่าง 5 แถวแรก)</div>' +
    '<table class="preview-table"><tr><th>เบอร์โทรศัพท์</th><th>ชื่อ</th><th>นามสกุล</th><th>หน่วยงาน</th></tr>' + previewRows + '</table>';
  document.getElementById('importBtn').disabled = parsedRows.length === 0;
};

async function doImport(){
  if(!parsedRows.length) return;
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า…';
  const resultArea = document.getElementById('resultArea');
  resultArea.innerHTML = '';

  const BATCH = 200;
  let success = 0, failed = 0, errMsg = '';
  for(let i=0; i<parsedRows.length; i+=BATCH){
    const batch = parsedRows.slice(i, i+BATCH);
    const { error } = await sb.from('staff_roster').upsert(batch, { onConflict: 'phone_number' });
    if(error){ failed += batch.length; errMsg = error.message; }
    else success += batch.length;
  }

  btn.disabled = false; btn.textContent = 'นำเข้าข้อมูล';
  if(failed === 0){
    resultArea.innerHTML = '<div class="result ok">✓ นำเข้าสำเร็จ ' + success + ' รายการ (ข้อมูลเดิมที่มีเลขบัตรซ้ำจะถูกอัปเดตทับ)</div>';
  }else{
    resultArea.innerHTML = '<div class="result err">นำเข้าสำเร็จ ' + success + ' รายการ · ล้มเหลว ' + failed + ' รายการ<br>' + errMsg + '</div>';
  }
}
</script>
</body>
</html>
